<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>status | daniel.log.br</title>
    <link rel="stylesheet" href="/style/principal.css">
    <link rel="icon" href="data:,">
    <!-- Chart.js para o gráfico -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .status-card {
            border: 1px solid #ddd;
            padding: 15px;
            background-color: #fafafa;
            margin-top: 15px;
        }
        .pod-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .pod-card {
            border: 1px solid #eee;
            padding: 10px;
            background: #fff;
            font-size: 0.85rem;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 2px;
        }
        .badge-running { background-color: #d1fae5; color: #065f46; }
        .badge-stopped { background-color: #fee2e2; color: #991b1b; }
        .chart-container {
            position: relative;
            height: 280px;
            width: 100%;
        }
        #loading-text {
            font-style: italic;
            color: #777;
        }
    </style>
</head>
<body>

<header>
    <h1>daniel</h1>
    <div class="nav">
        [<a href="/"> log </a>] 
        [<a href="/fotos"> fotos </a>] 
        [<a href="/status" class="active"> status </a>]
        [<a href="/sobre"> sobre </a>] 
    </div>
</header>

<main>
    <h2>infra <span id="terminal-spinner">⠋</span></h2>

    <!-- Seção do Gráfico -->
    <div class="status-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <strong>cpu | ram | disco | ex01 | ex02 (%)</strong>
            <span id="last-update" style="font-size: 0.75rem; color: #888;"></span>
        </div>
        <div class="chart-container">
            <canvas id="metricsChart"></canvas>
        </div>
    </div>

    <!-- Seção dos Pods -->
    <div style="margin-top: 2rem;">
        <h2>pods</h2>
        <div id="podsList" class="pod-grid">
            <p id="loading-text">Coletando dados do servidor...</p>
        </div>
    </div>
</main>

<footer>
    <p>Feito para durar.</p>
</footer>

<script src="/scripts.js"></script>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwjBpUFtHLVLGlnoGNUiVCNhDOi9jEv9RSqIR6ViiDEV7OgoJMxKaXT8KrOrxGu-9h-/exec";

async function renderDashboard() {
    const podsContainer = document.getElementById('podsList');
    const updateSpan = document.getElementById('last-update');

    try {
        const response = await fetch(API_URL, { redirect: 'follow' });
        const data = await response.json();

        if (!data.sistema || data.sistema.length === 0) {
            podsContainer.innerHTML = "<p>Nenhum dado encontrado ainda na planilha.</p>";
            return;
        }

        // Extrai apenas a hora (HH:mm) do formato ISO ou do formato com espaço
        const labels = data.sistema.map(item => {
            if (!item.horario) return '';
            try {
                const date = new Date(item.horario);
                // Subtrai 3 horas para ajustar para o fuso -3
                date.setHours(date.getHours());
                const h = String(date.getHours()).padStart(2, '0');
                const m = String(date.getMinutes()).padStart(2, '0');
                return `${h}:${m}`;
            } catch (e) {
                // Fallback caso o formato venha diferente
                return item.horario.substring(11, 16) || item.horario;
            }
        });
        
        const cpuData = data.sistema.map(item => item.cpu);
        const cpumData = data.sistema.map(item => item.cpu_max);
        const ramData = data.sistema.map(item => item.ram);
        const rammData = data.sistema.map(item => item.ram_max);
        const discoData = data.sistema.map(item => item.disco);
        const ex01Data = data.sistema.map(item => item.disco_ex_1);
        const ex02Data = data.sistema.map(item => item.disco_ex_2);

        updateSpan.innerText = `Atualizado: ${labels[labels.length - 1]}`;

        const ctx = document.getElementById('metricsChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: 'CPU', data: cpuData, borderColor: '#2563eb', backgroundColor: '#2563eb', borderWidth: 2, pointRadius: 0, tension: 0.3 },
                    { label: 'CPU máx', data: cpumData, borderColor: '#F20707', backgroundColor: '#F20707', borderWidth: 1, pointRadius: 0, tension: 0.3, borderDash: [4, 4] },
                    { label: 'RAM', data: ramData, borderColor: '#8b5cf6', backgroundColor: '#8b5cf6', borderWidth: 2, pointRadius: 0, tension: 0.3},
                    { label: 'RAM máx', data: rammData, borderColor: '#F2D307', backgroundColor: '#F2D307', borderWidth: 1, pointRadius: 0, tension: 0.3, borderDash: [4, 4]},
                    { label: 'DISCO', data: discoData, borderColor: '#10b981', backgroundColor: '#10b981', borderWidth: 1.5, pointRadius: 0, tension: 0.3 },
                    { label: 'Ex01', data: ex01Data, borderColor: '#f59e0b', backgroundColor: '#f59e0b', borderWidth: 1, pointRadius: 0, tension: 0.3 },
                    { label: 'Ex02', data: ex02Data, borderColor: '#ec4899', backgroundColor: '#ec4899', borderWidth: 1, pointRadius: 0, tension: 0.3 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { intersect: false, mode: 'index' },
                plugins: {
                    legend: {
                        position: 'top',
                        labels: { 
                            boxWidth: 12, 
                            font: { size: 10, family: 'Courier New' }, 
                            usePointStyle: true,
                            pointStyle: 'circle'
                        }
                    }
                },
                scales: {
                    x: {
                        grid: {
                            display: true,
                            color: '#f0f0f0',
                            drawBorder: false
                        },
                        ticks: { 
                            font: { size: 10, family: 'Courier New' },
                            maxRotation: 0,
                            minRotation: 0,
                            autoSkip: true,
                            maxTicksLimit: 12
                        }
                    },
                    y: {
                        min: 0,
                        max: 100,
                        ticks: { font: { size: 10, family: 'Courier New' } },
                        grid: { color: '#f3f4f6' }
                    }
                }
            }
        });

        podsContainer.innerHTML = '';
        if (data.pods.length === 0) {
            podsContainer.innerHTML = '<p>Nenhum pod ativo no momento.</p>';
        } else {
            data.pods.forEach(pod => {
                const isRunning = pod.status.toLowerCase().includes('running');
                podsContainer.innerHTML += `
                    <div class="pod-card">
                        <div style="font-weight: bold; margin-bottom: 5px;">${pod.nome}</div>
                        <div>Status: <span class="badge ${isRunning ? 'badge-running' : 'badge-stopped'}">${pod.status}</span></div>
                        <div style="color: #666; margin-top: 3px;">Restarts: ${pod.reinicios}</div>
                    </div>
                `;
            });
        }

    } catch (err) {
        console.error("Erro ao carregar métricas:", err);
        podsContainer.innerHTML = "<p>Erro ao conectar com a API de monitoramento.</p>";
    }
}

document.addEventListener("DOMContentLoaded", renderDashboard);
</script>
</body>
</html>
